[package]
name = "alpacka"
version = "0.1.0"
edition = "2024"
description = "A engine agnostic asset packaging format"
license = "Unlicense"
authors = ["Luramoth"]
repository = "https://github.com/Luramoth/alpacka"

[dependencies]
lz4 = { version = "1.28.1", optional = true }
toml = { version = "1.1.2" }
zstd = { version = "0.13.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
wincode = { version = "0.6.1", features = ["derive"], optional = true }
flate2 = { version = "1.1.9", optional = true }
positioned-io = { version = "0.3.5", optional = true }
xxhash-rust = { version = "0.8.16", features = ["xxh3"], optional = true }
chacha20poly1305 = { version = "0.11.0", optional = true }
hkdf = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
aead-stream = { version = "0.6.0", features = ["alloc"], optional = true }
rand = { version = "0.10.2", optional = true }
tempfile = { version = "3.27.0", optional = true }
thiserror = { version = "2.0.20" }

[dev-dependencies]
pretty_assertions = "1.4.1"
lipsum = "0.9.1"
tempfile = "3.27.0"
rand = "0.10.2"

[features]
writer = [
    "dep:lz4",
    "dep:zstd",
    "dep:flate2",
    "dep:wincode",
    "dep:positioned-io",
    "dep:xxhash-rust",
    "dep:chacha20poly1305",
    "dep:hkdf",
    "dep:sha2",
    "dep:aead-stream",
    "dep:rand"
]
reader = [
    "dep:lz4",
    "dep:zstd",
    "dep:flate2",
    "dep:wincode",
    "dep:positioned-io",
    "dep:xxhash-rust",
    "dep:chacha20poly1305",
    "dep:hkdf",
    "dep:sha2",
    "dep:aead-stream",
    "dep:rand",
    "dep:tempfile"
]
packager_api = []
preprocessor_api = [
    "dep:tempfile"
]